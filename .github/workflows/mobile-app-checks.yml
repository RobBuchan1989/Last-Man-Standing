name: Mobile app checks

on:
  push:
    branches:
      - mobile-app-foundation
    paths:
      - "mobile/native/**"
      - ".github/workflows/mobile-app-checks.yml"
  pull_request:
    paths:
      - "mobile/native/**"
      - ".github/workflows/mobile-app-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck Expo app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/native
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install native app dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Validate Expo configuration
        run: npx expo config --type public
