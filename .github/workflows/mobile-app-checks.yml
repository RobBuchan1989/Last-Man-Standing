name: Mobile and staging backend checks

on:
  push:
    branches:
      - mobile-app-foundation
    paths:
      - "mobile/native/**"
      - "supabase/functions/mobile-league/**"
      - "supabase/migrations/**"
      - ".github/workflows/mobile-app-checks.yml"
  pull_request:
    paths:
      - "mobile/native/**"
      - "supabase/functions/mobile-league/**"
      - "supabase/migrations/**"
      - ".github/workflows/mobile-app-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Expo typecheck and config
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/native
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install native app dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Validate Expo configuration
        run: npx expo config --type public

  edge-function:
    name: Check mobile Edge Function
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck staging Edge Function
        run: deno check supabase/functions/mobile-league/index.ts
